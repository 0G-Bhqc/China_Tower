<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e4e8e2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="三座经 DCC 高模解析的中国楼阁 Three.js 展示" />
    <title>中国楼阁 · 高模 3D 藏品</title>
    <style>
      /* 关键首屏样式内联: dev 模式下样式表按需注入, 模块链加载完成前
         页面会以裸 HTML 闪现——这段保证首帧就是完整的加载页。 */
      html, body { margin: 0; height: 100%; background: #dfe6e2; overflow: hidden; }
      .loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(223,230,226,.97); z-index: 50; font-family: "Noto Serif SC", "Songti SC", SimSun, serif; color: #201a16; text-align: center; }
      .loader-brand { font-size: 44px; letter-spacing: .12em; }
      .loader-sub, .loader-status { margin-top: 8px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 10px; font-weight: 800; letter-spacing: .2em; color: #776653; }
      .loader-track { margin: 18px auto 0; width: 220px; height: 2px; background: rgba(55,45,36,.14); overflow: hidden; }
      .loader-bar { height: 100%; width: 0%; background: #d58b42; transition: width .25s ease; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="中国楼阁高模三维展示，可旋转并选择构件"></canvas>

    <div id="loader" class="loader" aria-hidden="false">
      <div class="loader-inner">
        <div class="loader-brand">中国楼阁</div>
        <div class="loader-sub">高模 3D 藏品</div>
        <div class="loader-track" aria-hidden="true">
          <div id="loader-bar" class="loader-bar"></div>
        </div>
        <div id="loader-status" class="loader-status">准备加载…</div>
      </div>
    </div>

    <main class="shell" style="display:none" data-shell-deferred>
      <header class="intro">
        <p class="eyebrow">THREE VERIFIED DCC HIGH MODELS</p>
        <h1 id="tower-title">岳阳楼</h1>
        <p class="english" id="tower-english">YUEYANG TOWER</p>
        <p class="location" id="tower-location">湖南 · 岳阳 · 三层盔顶 · 临洞庭湖</p>
        <p class="description" id="tower-description">飞檐层叠、暗红梁柱与开阔回廊构成的临水楼阁。</p>
      </header>

      <nav class="pavilion-nav" aria-label="楼阁选择">
        <button class="is-active" aria-pressed="true" data-pavilion="yueyang">
          <span class="nav-index"><b>01</b></span>
          <span class="nav-label">岳阳楼</span>
        </button>
        <button aria-pressed="false" data-pavilion="huanghe">
          <span class="nav-index"><b>02</b></span>
          <span class="nav-label">黄鹤楼</span>
        </button>
        <button aria-pressed="false" data-pavilion="tengwang">
          <span class="nav-index"><b>03</b></span>
          <span class="nav-label">滕王阁</span>
        </button>
      </nav>

      <section class="controls" aria-label="模型控制">
        <button id="explode" aria-pressed="false" aria-keyshortcuts="E">展开构件</button>
        <button id="low-angle" aria-pressed="false" aria-keyshortcuts="V">仰视建筑</button>
        <button id="poetry-toggle" aria-pressed="false" aria-keyshortcuts="P">诗文</button>
        <button id="reset-view" aria-keyshortcuts="R">重置视角</button>
        <button id="toggle-debug-screenshot" aria-keyshortcuts="D">保存诊断截图</button>
      </section>

      <p class="status" id="status" role="status" aria-live="polite">ORBIT · DRAG TO INSPECT</p>

      <nav class="scene-cue-buttons" id="scene-cue-buttons" aria-label="诗境机位"></nav>

      <aside class="scene-reading" id="scene-reading" aria-live="polite">
        <p class="scene-reading-kicker">POETIC VIEWPOINT · 诗境机位</p>
        <h2 id="reading-title">—</h2>
        <p class="scene-reading-line" id="reading-line">—</p>
        <p class="scene-reading-observation" id="reading-observation">—</p>
      </aside>

      <footer>
        <span class="footer-hint">拖拽旋转 · 点击构件 · 滚轮缩放</span>
        <span class="footer-keys">1–3 切换 · V 仰视 · E 展开 · P 诗文 · R 重置</span>
      </footer>
    </main>

    <aside class="poetry-panel" id="poetry-panel" aria-label="诗文面板" aria-hidden="true" style="visibility:hidden" data-panel-deferred>
      <header class="poetry-panel-head">
        <div>
          <p class="panel-kicker">CLASSIC TEXTS · 古诗文</p>
          <h2 id="poetry-tower">岳阳楼 · 诗文</h2>
        </div>
        <button class="icon-button" id="poetry-close" aria-label="关闭诗文面板">×</button>
      </header>
      <nav class="content-tabs" id="poetry-tabs" aria-label="诗文篇目"></nav>
      <div class="poetry-panel-body" id="poetry-body"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
    <script>
      window.__CHINA_TOWERS_UI__ = {
        setLoaderVisible(visible) {
          const loader = document.getElementById('loader');
          if (!loader) return;
          loader.hidden = !visible;
          loader.setAttribute('aria-hidden', String(!visible));
        },
        setLoaderProgress(ratio, statusText) {
          const bar = document.getElementById('loader-bar');
          const status = document.getElementById('loader-status');
          if (bar) bar.style.width = `${Math.max(0, Math.min(100, (ratio || 0) * 100))}%`;
          if (status && statusText) status.textContent = statusText;
        },
        setModelMeta(meta) {
          const section = document.getElementById('model-meta');
          if (!section || !meta) return;
          section.hidden = false;
          const setText = (id, value) => {
            const el = document.getElementById(id);
            if (el) el.textContent = value ?? '—';
          };
          setText('meta-model-name', meta.modelName);
          setText('meta-lod', meta.runtimeLod);
          setText('meta-triangles', meta.renderTriangles != null ? String(meta.renderTriangles) : '—');
          setText('meta-parts', meta.partCount != null ? String(meta.partCount) : '—');
        }
      };
    </script>
  </body>
</html>
